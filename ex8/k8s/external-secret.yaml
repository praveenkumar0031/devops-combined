apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-secret
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: demo-secret

  data:
    - secretKey: username
      remoteRef:
        key: demo-secret
        property: username

    - secretKey: password
      remoteRef:
        key: demo-secret
        property: password